<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="FlexContainer1">
      <h1 class="FlexItem1">Carmelita Pilloni Mitchell</h1>

      <nav class="FlexItem2">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="contact.html">Contact</a>
      </nav>
    </header>

    <main class="PageContentContact">
      <section class="CardContact">
        <h1>Let's Connect</h1>
        <p>
          Open to full-time roles, consulting opportunities and thoughtful
          collaborations. <br />
          I typically respond within one business day.
        </p>

        <img class="ContactImage" src="Headshot.webp" />

        <form class="ContactForm">
          <div class="FormFields">
            <label for="FirstName"> First Name</label>
            <input type="text" id="FirstName" />
          </div>

          <div class="FormFields">
            <label for="LastName"> Last Name</label>
            <input type="text" id="LastName" />
          </div>

          <div class="FormFields">
            <label for="EmailAddress"> Email Address</label>
            <input type="email" id="EmailAddress" />
          </div>

          <div class="FormFields">
            <label for="Message">Message Here </label>
            <textarea id="Message" name="message" rows="5"></textarea>
          </div>

          <button type="submit">Submit</button>
        </form>
      </section>
    </main>
    <footer class="FlexContainer2">
      <p>&copy; 2026 Carmelita Pilloni Mitchell. All rights reserved</p>
    </footer>
  </body>
</html>
